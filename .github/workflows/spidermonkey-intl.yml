name: Experimental SpiderMonkey Intl guest

on:
  workflow_dispatch:
    inputs:
      saved_frame_eval:
        description: Build the reviewed guest SavedFrame eval-provenance extension
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spidermonkey-intl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guest-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build the pinned Intl guest library
        env:
          INTL_BUILD_WORK: ${{ runner.temp }}/spidermonkey-intl
          SM_SAVED_FRAME_EVAL: ${{ inputs.saved_frame_eval && '1' || '0' }}
        run: python -B -I tests/node-compat/frameworks/nextjs/spidermonkey-intl-build-v1/build.py "$INTL_BUILD_WORK"
      - name: Retain diagnostics and any coherent distribution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spidermonkey-147-intl${{ inputs.saved_frame_eval && '-savedframe-eval' || '' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spidermonkey-intl/evidence/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
